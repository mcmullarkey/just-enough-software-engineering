lesson_name: "write_less_code_i_py"
language: Python
description: "Break a do-everything one-liner into chunks that each do one thing"
textbook_reference: "Just Enough Software Engineering - Write less code, part I"

exercise:
  type: "function_writing"
  prompt: |
    The one-liner in the template works, but it does everything at once. Rewrite it
    so each chunk does one thing, following the pseudocode comments. Store the final
    table in `penguins_sorted` with columns `species` and `avg_bill_length`.
